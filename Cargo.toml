[package]
name = "sth-account"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
migration = { path = "migration" }
entity = { path = "entity" }
tokio = { version = "1", features = ["full"] }

[dependencies.sea-orm]
version = "1.1.0"
features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-time",
  "with-json",
  "with-uuid",
  "postgres-array"
]
