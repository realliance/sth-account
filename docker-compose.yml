services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sth_account
      POSTGRES_USER: sth_user
      POSTGRES_PASSWORD: sth_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sth_user -d sth_account"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
