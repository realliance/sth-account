[package]
name = "entity"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
country-code = "0.3.0"

[dependencies.sea-orm]
version = "1.1.0" 
features = [
  "sqlx-postgres",
  "runtime-tokio-rustls", 
  "macros",
  "with-chrono",
  "with-time",
  "with-json",
  "with-uuid",
  "postgres-array"
]
